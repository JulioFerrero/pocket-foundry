# Meson's machine file for arm64 (toolchain.sh).
[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'aarch64-linux-gnu-pkg-config'
# Runs configure tests on an x86-64 machine (deps.sh installs it), so they find what they would on arm64 (Mesa's
# -mtls-dialect). An arm64 machine runs them itself.
exe_wrapper = 'qemu-aarch64'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
