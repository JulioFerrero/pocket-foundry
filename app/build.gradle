apply plugin: 'com.android.application'
apply from: '../third_party/termux-x11/lorie/version.gradle'

android {
    namespace 'app.pocketfoundry'
    compileSdk 36
    ndkVersion termuxX11NdkVersion   // :lorie's, so one NDK builds both

    defaultConfig {
        applicationId 'app.pocketfoundry'
        minSdk 29
        targetSdk 34
        versionCode project.versionCode.toInteger()   // both in gradle.properties
        versionName project.versionName
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild.cmake.path 'src/main/cpp/CMakeLists.txt'

    // Extracted native libraries are the only files an app may exec on Android 10+; the glibc loader is one.
    packaging.jniLibs.useLegacyPackaging true

    // Built by runtime/build.sh.
    sourceSets.main {
        assets.srcDirs += '../runtime/out/apk/assets'
        jniLibs.srcDirs += '../runtime/out/apk/jniLibs'
    }

    // The release key signs debug builds too, so either installs over the other and the imported game stays.
    // Its paths start at the repo root, as in tools/release.sh.
    def signing = rootProject.file(System.getenv('POCKETFOUNDRY_SIGNING') ?: '../pocketfoundry-keys/keystore.properties')
    if (signing.exists()) {
        def key = new Properties()
        signing.withInputStream { key.load(it) }
        signingConfigs {
            pocketfoundry {
                storeFile rootProject.file(key.storeFile)
                storePassword key.storePassword
                keyAlias key.keyAlias
                keyPassword key.keyPassword
            }
        }
        buildTypes {
            debug.signingConfig signingConfigs.pocketfoundry
            release.signingConfig signingConfigs.pocketfoundry
        }
    }

    // R8 drops the unused parts of the libraries: about 10 MB of the APK, as Android stores code uncompressed.
    buildTypes.release {
        minifyEnabled true
        shrinkResources true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':lorie')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub in local tests: every method throws.
    testImplementation 'org.json:json:20240303'
}
