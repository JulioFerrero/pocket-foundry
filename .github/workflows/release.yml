# Builds a version tag from source and publishes it: v0.8.17-beta.1 as a pre-release, v0.8.17 as a release.
# tools/release.sh makes the tag. Everything in the APK comes from this repository at that tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The unit tests, on their own: F-Droid's build below runs none.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Termux:X11 with Pocket Foundry's patches
        run: tools/setup.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: |
          sdkmanager=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $sdkmanager --licenses > /dev/null
          ndk=$(sed -n 's/.*termuxX11NdkVersion = "\(.*\)"/\1/p' third_party/termux-x11/lorie/version.gradle)
          $sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$ndk" 'cmake;3.22.1' > /dev/null
      - name: Test
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  # The APK, built as F-Droid's build server builds it (tools/fdroid-build.sh: its image, its tools, the recipe from
  # tools/fdroid-recipe.sh, runtime and all), then signed with Pocket Foundry's key. F-Droid builds each release the
  # same way and ships this APK, ours, only when its own comes out the same.
  apk:
    needs: test
    runs-on: ubuntu-24.04
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    permissions:
      contents: write       # the GitHub release
      id-token: write       # the build attestation
      attestations: write
    steps:
      - name: Git, for the checkout; GitHub's CLI, for the release
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git gh > /dev/null
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the notes list the commits since the last tag
      - name: Build as F-Droid does
        run: tools/fdroid-build.sh
      - name: Pocket Foundry's key
        env:
          KEYSTORE: ${{ secrets.POCKETFOUNDRY_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.POCKETFOUNDRY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POCKETFOUNDRY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POCKETFOUNDRY_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "The POCKETFOUNDRY_* secrets are missing"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
              > "$RUNNER_TEMP/keystore.properties"
          echo "POCKETFOUNDRY_SIGNING=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
      - name: Sign
        run: |
          prop() { sed -n "s/^$1=//p" "$POCKETFOUNDRY_SIGNING"; }
          apksigner=$(ls -d /opt/android-sdk/build-tools/*/apksigner | tail -1)
          PF_STOREPASS=$(prop storePassword) PF_KEYPASS=$(prop keyPassword) "$apksigner" sign \
              --ks "$(prop storeFile)" --ks-key-alias "$(prop keyAlias)" \
              --ks-pass env:PF_STOREPASS --key-pass env:PF_KEYPASS \
              --out build/fdroid/signed.apk build/fdroid/app.pocketfoundry_*.apk
          echo "APK=build/fdroid/signed.apk" >> "$GITHUB_ENV"
      - name: Check the APK
        run: ANDROID_HOME=/opt/android-sdk tools/release.sh check "${GITHUB_REF_NAME#v}"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release/*.apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release.sh publish "${GITHUB_REF_NAME#v}"
