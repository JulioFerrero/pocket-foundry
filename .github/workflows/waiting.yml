# Issues waiting on their reporter, labelled needs-info: a reminder after 14 days without an answer, closed 7 days
# after it. The reporter's reply takes the label off, so issues waiting on the maintainer are never touched.
name: Waiting for an answer
on:
  schedule:
    - cron: "30 6 * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@v11
        with:
          any-of-issue-labels: needs-info
          days-before-issue-stale: 14
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-issue-message: >-
            There's been no answer here for two weeks. If this still happens on the newest version, reply with what I
            asked above, or paste the Logs (**Logs -> Copy**); otherwise this closes in a week. You can reopen it
            anytime.
          close-issue-message: >-
            Closing for now, as there's been no answer. Reopen it anytime with the Logs (**Logs -> Copy**).
          close-issue-reason: not_planned

  answered:
    if: >-
      github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
      github.event.comment.user.login == github.event.issue.user.login &&
      contains(github.event.issue.labels.*.name, 'needs-info')
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue edit "$NUMBER" -R "$REPO" --remove-label needs-info --remove-label stale
